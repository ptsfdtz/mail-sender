[package]
name = "mail-sender"
version = "2.0.0"
description = "Desktop bulk HTML email sender"
authors = ["ptsfdtz"]
edition = "2021"

[lib]
name = "mail_sender_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calamine = "0.31"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "native-tls", "smtp-transport", "pool"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
